[package]
name = "levelize"
version = "0.1.0"
edition = "2024"
default-run = "levelize"
rust-version = "1.85"
description = "Adaptive loudness leveling for spoken-word audio — a modern Levelator as a CLI"
repository = "https://github.com/FreedomBen/levelize"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["audio", "loudness", "podcast", "normalization", "ebu-r128"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/.github"]

[features]
# Builds the levelize-man binary, which generates the man page.
mangen = ["dep:clap_mangen"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_mangen = { version = "0.2", optional = true }
ebur128 = "0.1"
flacenc = { version = "0.5.1", default-features = false }
indicatif = "0.18.6"
serde_json = "1.0.154"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "aiff"] }
tempfile = "3.27.0"

[[bin]]
name = "levelize-man"
required-features = ["mangen"]
